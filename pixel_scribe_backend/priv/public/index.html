<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Gleam Chat</title>
    <style>
      body {
        height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: system-ui;
        margin: 0;
      }

      header,
      form {
        background: #ffaff3;
        overflow: hidden;
        padding: 1rem;
      }

      input,
      button {
        padding: 0.5rem;
      }

      article {
        background: #a6f0fc;
        padding: 0.5rem;
        border-radius: 0.5rem;
      }

      article:first-child {
        margin-top: auto;
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 style="margin: 0">Real-Time Gleam Chat</h1>
    </header>

    <div id="messages">
      <!-- Messages go here -->
    </div>

    <form action="/post" method="post" style="display: flex; gap: 0.5rem">
      <input type="text" name="message" style="flex: 1" required maxlength="128" />
      <button type="submit">Send</button>
    </form>

    <script>
      // Open a connection to the SSE endpoint
      const messages = document.querySelector('#messages');
      const socket = new WebSocket('/ws');
      // Connection opened
      socket.onopen = function(event) {
        console.log('Connected to the server.');
        socket.send('Hello Server!');
      };

      // Listen for messages
      socket.onmessage = function(event) {
        console.log('Message from server: ', event.data);
      };

      // Handle errors
      socket.onerror = function(error) {
        console.error('WebSocket error: ', error);
      };

      // Connection closed
      socket.onclose = function(event) {
        console.log('Connection closed.');
      };

      // Handle form submission client-side
      const form = document.querySelector('form');
      form.onsubmit = async (event) => {
        // Prevent the browser from navigating to /post
        event.preventDefault();
        // Send the message to the POST endpoint
        const msg = new FormData(form).get('message');
        socket.send(msg)
        // Clear the message field
        form.reset();
      };
    </script>
  </body>
</html>
